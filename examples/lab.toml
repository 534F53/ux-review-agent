url = "http://127.0.0.1:8765/lab.html?variant=clear"
output = "../reports"
session_mode = "isolated"

[model]
name = "litellm_proxy/REPLACE_WITH_YOUR_GATEWAY_ALIAS"
api_base = "http://127.0.0.1:4000"
api_key_env = "LITELLM_PROXY_API_KEY"
response_mode = "prompted"
# Set this to your deployment's actual usable context limit when known.
# context_tokens = 32768

[limits]
active_seconds = 600
evaluation_seconds = 300
request_timeout_seconds = 90

[[tasks]]
id = "lab-health"
description = "Assess Lab North's health. Identify its hottest device, give the temperature with its unit, and inspect the warning cause and recommended action."

[[tasks]]
id = "calibration-check"
description = "Check Device-03 in Lab North. Report its current health, temperature with its unit, and next calibration date."
