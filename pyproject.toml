[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "visualux-agent"
version = "0.1.0"
description = "Visual, task-driven web usability evaluation with inspectable evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["playwright==1.64.1", "litellm==1.108.1", "pydantic==2.14.3"]

[project.scripts]
visualux = "visualux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visualux = ["rubrics/*.md", "demo_apps/*"]

[tool.setuptools.data-files]
"share/visualux/examples" = ["examples/*.toml", "examples/*.md"]
